<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="회사명과 이름 기반 날짜·시간 예약 시스템">
  <title>예약 시스템</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout-fix.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main class="app-shell">
    <section id="loginView" class="login-layout">
      <div class="brand-panel">
        <span class="eyebrow">RESERVATION SYSTEM</span>
        <h1>예약 시스템</h1>
        <p>전체 예약 일정을 한눈에 확인하고 간편하게 예약하세요.</p>
        <div class="brand-points">
          <span>✓ 모바일·PC 지원</span><span>✓ 실시간 중복 예약 방지</span><span>✓ 내 예약 직접 관리</span>
        </div>
      </div>
      <form id="loginForm" class="card login-card">
        <div class="card-heading">
          <span class="icon-box">ID</span>
          <div><h2>예약자 로그인</h2><p>등록된 회사명과 이름을 입력해 주세요.</p></div>
        </div>
        <label for="company">회사명</label>
        <input id="company" name="company" autocomplete="organization" maxlength="100" placeholder="회사명" required>
        <label for="loginName">이름</label>
        <input id="loginName" name="name" autocomplete="name" maxlength="100" placeholder="이름" required>
        <button class="btn primary full" type="submit">로그인</button>
        <p class="security-note">Google Spreadsheet에 등록된 회사명과 이름으로 확인합니다.</p>
      </form>
    </section>

    <section id="appView" class="hidden">
      <header class="topbar">
        <div><span class="eyebrow">RESERVATION</span><h1>예약 시스템</h1></div>
        <div class="user-block"><div><strong id="userName"></strong><span id="userDepartment"></span></div><button id="adminModeBtn" class="btn secondary">관리자 모드</button><button id="logoutBtn" class="btn ghost">로그아웃</button></div>
      </header>

      <nav class="tabs" aria-label="주 메뉴">
        <button class="tab active" data-view="booking">예약하기</button>
        <button class="tab" data-view="my">내 예약</button>
        <button id="masterTab" class="tab hidden" data-view="master">마스터 관리</button>
      </nav>

      <section id="bookingPanel" class="panel-view">
        <div class="booking-grid">
          <article class="card calendar-card">
            <div class="section-head"><div><h2>전체 예약 일정</h2><p>날짜 안의 시간을 눌러 예약하세요.</p></div></div>
            <div id="calendar" class="calendar-months"></div>
            <div class="legend"><span><i class="dot available"></i>예약 가능</span><span><i class="dot booked"></i>예약 마감</span></div>
          </article>
        </div>
      </section>

      <section id="myPanel" class="panel-view hidden">
        <article class="card"><div class="section-head"><div><h2>내 예약</h2><p>예약 내역을 확인하거나 취소할 수 있습니다.</p></div><button id="refreshMyBtn" class="btn secondary">새로고침</button></div><div id="myReservations" class="table-wrap"></div></article>
      </section>

      <section id="masterPanel" class="panel-view hidden">
        <div class="master-nav">
          <button class="subtab active" data-master="users">사용자</button><button class="subtab" data-master="departments">부서</button><button class="subtab" data-master="availability">예약 일정</button><button class="subtab" data-master="reservations">전체 예약</button>
        </div>
        <div id="masterContent"></div>
      </section>
    </section>
  </main>

  <dialog id="formDialog"><form id="dialogForm" method="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="dialogClose" class="icon-btn">×</button></div><div id="dialogFields" class="form-grid"></div><div class="dialog-actions"><button type="button" id="dialogCancel" class="btn ghost">취소</button><button type="submit" class="btn primary">저장</button></div></form></dialog>
  <script src="app.js"></script>
</body>
</html>
